<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Full bleed background for maskable safe zone -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Glow -->
  <circle cx="256" cy="256" r="160" fill="url(#glow)"/>
  <!-- Outer ring -->
  <circle cx="256" cy="256" r="130" fill="none" stroke="#00f0ff" stroke-width="2.5" opacity="0.35"/>
  <!-- Middle ring -->
  <circle cx="256" cy="256" r="90" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.5"/>
  <!-- Inner ring -->
  <circle cx="256" cy="256" r="50" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.7"/>
  <!-- Center dot -->
  <circle cx="256" cy="256" r="16" fill="#00f0ff" opacity="0.95"/>
  <circle cx="256" cy="256" r="9" fill="#020408"/>
  <circle cx="256" cy="256" r="5" fill="#00f0ff"/>
  <!-- Crosshair lines (shortened for safe zone) -->
  <line x1="256" y1="110" x2="256" y2="150" stroke="#00f0ff" stroke-width="3" stroke-linecap="round"/>
  <line x1="256" y1="362" x2="256" y2="402" stroke="#00f0ff" stroke-width="3" stroke-linecap="round"/>
  <line x1="110" y1="256" x2="150" y2="256" stroke="#00f0ff" stroke-width="3" stroke-linecap="round"/>
  <line x1="362" y1="256" x2="402" y2="256" stroke="#00f0ff" stroke-width="3" stroke-linecap="round"/>
  <!-- Echo wave arcs -->
  <path d="M 256 206 A 50 50 0 0 1 306 256" fill="none" stroke="#00f0ff" stroke-width="3" opacity="0.8" stroke-linecap="round"/>
  <path d="M 256 176 A 80 80 0 0 1 336 256" fill="none" stroke="#00f0ff" stroke-width="2.5" opacity="0.5" stroke-linecap="round"/>
</svg>
