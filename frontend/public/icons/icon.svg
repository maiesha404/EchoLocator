<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <!-- Glow -->
  <circle cx="256" cy="256" r="200" fill="url(#glow)"/>
  <!-- Outer ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#00f0ff" stroke-width="2.5" opacity="0.35"/>
  <!-- Middle ring -->
  <circle cx="256" cy="256" r="110" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.5"/>
  <!-- Inner ring -->
  <circle cx="256" cy="256" r="60" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.7"/>
  <!-- Center dot -->
  <circle cx="256" cy="256" r="18" fill="#00f0ff" opacity="0.95"/>
  <circle cx="256" cy="256" r="10" fill="#020408"/>
  <circle cx="256" cy="256" r="6" fill="#00f0ff"/>
  <!-- Crosshair lines -->
  <line x1="256" y1="80" x2="256" y2="130" stroke="#00f0ff" stroke-width="3" stroke-linecap="round"/>
  <line x1="256" y1="382" x2="256" y2="432" stroke="#00f0ff" stroke-width="3" stroke-linecap="round"/>
  <line x1="80" y1="256" x2="130" y2="256" stroke="#00f0ff" stroke-width="3" stroke-linecap="round"/>
  <line x1="382" y1="256" x2="432" y2="256" stroke="#00f0ff" stroke-width="3" stroke-linecap="round"/>
  <!-- Diagonal tick marks -->
  <line x1="140" y1="140" x2="165" y2="165" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="347" y1="347" x2="372" y2="372" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="372" y1="140" x2="347" y2="165" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="140" y1="372" x2="165" y2="347" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <!-- Echo wave arcs (top-right quadrant) -->
  <path d="M 256 196 A 60 60 0 0 1 316 256" fill="none" stroke="#00f0ff" stroke-width="3" opacity="0.8" stroke-linecap="round"/>
  <path d="M 256 156 A 100 100 0 0 1 356 256" fill="none" stroke="#00f0ff" stroke-width="2.5" opacity="0.5" stroke-linecap="round"/>
  <!-- Text -->
  <text x="256" y="480" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#00f0ff" letter-spacing="4" opacity="0.7">ECHO</text>
</svg>
